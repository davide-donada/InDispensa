<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InDispensa - Lista Spesa Condivisa</title>
    
    <!-- Meta PWA / iOS -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InDispensa">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081986.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <style>
        .item-checked {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-16 overflow-x-hidden">

    <!-- Schermata di Login Obbligatoria -->
    <div id="loginScreen" class="fixed inset-0 bg-indigo-600 z-50 flex items-center justify-center p-6 text-white text-center">
        <div class="max-w-sm w-full bg-white text-gray-800 p-8 rounded-2xl shadow-2xl space-y-6">
            <div class="text-5xl">🛒</div>
            <div>
                <h1 class="text-2xl font-extrabold text-indigo-900">InDispensa</h1>
                <p class="text-xs text-gray-500 mt-1">La tua spesa e la tua casa in sintonia</p>
            </div>
            <p class="text-xs text-gray-600">Accedi con il tuo account Google per visualizzare e sincronizzare le liste di casa in tempo reale.</p>
            
            <button type="button" onclick="loginGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition active:scale-95 shadow-md">
                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Accedi con Google</span>
            </button>
        </div>
    </div>

    <!-- Main App Content -->
    <div id="appContent" class="hidden">
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2">
                        🛒 InDispensa
                    </h1>
                    <p id="progressCounter" class="text-xs text-indigo-200 mt-0.5">Caricamento...</p>
                </div>
                
                <!-- Profile Header -->
                <div id="userProfile" class="flex items-center gap-2">
                    <img id="userAvatar" src="" alt="User" class="w-7 h-7 rounded-full border border-indigo-300">
                    <span id="userName" class="text-xs font-semibold hidden sm:inline"></span>
                    <button onclick="logoutGoogle()" class="bg-indigo-700 hover:bg-indigo-800 text-[10px] py-1 px-2 rounded-md text-indigo-200 hover:text-white border border-indigo-500">Esci</button>
                </div>
            </div>
        </div>

        <div class="max-w-md mx-auto p-4 space-y-4 w-full box-border">

            <!-- Banner Casa / Selettore Multi-Casa -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-3 flex flex-wrap justify-between items-center gap-2 text-xs text-indigo-900 shadow-sm">
                <div class="flex items-center gap-1.5 flex-1 min-w-[180px]">
                    <span class="text-base">🏠</span>
                    <span class="font-medium">Casa:</span>
                    <select id="houseSelect" onchange="onHouseSelectChange(this.value)" class="bg-white border border-indigo-200 text-indigo-900 font-bold rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1 max-w-[180px] truncate">
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="eliminaCasaCorrente()" title="Rimuovi casa salvata" class="text-gray-400 hover:text-red-500 p-1 text-xs">🗑️</button>
                    <button onclick="copiaLink()" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-medium hover:bg-indigo-700 active:scale-95 transition shadow-sm flex items-center gap-1">
                        <span>🔗</span> Invita
                    </button>
                </div>
            </div>

            <!-- Barra Strumenti: Ricerca + Filtro "Da Comprare" -->
            <div class="flex gap-2">
                <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-100 flex items-center px-3 gap-2 flex-1">
                    <span class="text-gray-400 text-sm">🔍</span>
                    <input type="text" id="searchInput" oninput="filterList()" placeholder="Cerca prodotto..." class="w-full bg-transparent text-sm focus:outline-none py-1">
                    <button onclick="clearSearch()" id="clearSearchBtn" class="text-gray-400 text-xs hidden hover:text-gray-600">✕</button>
                </div>

                <button id="hideCheckedBtn" onclick="toggleHideChecked()" class="bg-white border border-gray-200 text-gray-700 text-xs px-3 py-2 rounded-xl font-medium shadow-sm flex items-center gap-1.5 active:scale-95 transition">
                    <span>👁️</span> <span id="hideCheckedLabel">Solo da prendere</span>
                </button>
            </div>

            <!-- Form Aggiunta Rapida -->
            <div class="bg-white p-3 rounded-xl shadow-sm space-y-2 border border-gray-100">
                <input type="text" id="newItemText" placeholder="Aggiungi nuovo prodotto..." class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <div class="flex gap-2">
                    <select id="newItemDept" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="Ortofrutta">🥬 Ortofrutta</option>
                        <option value="Carne e Pesce">🥩 Carne/Pesce</option>
                        <option value="Latticini e Uova">🧀 Latticini</option>
                        <option value="Dispensa">📦 Dispensa</option>
                        <option value="Surgelati">❄️ Surgelati</option>
                        <option value="Casa e Pulizia">🧹 Casa e Pulizia</option>
                        <option value="Bucato">🧺 Bucato</option>
                        <option value="Igiene Personale">🧴 Igiene Personale</option>
                        <option value="Sfizi e Dolci">🍫 Sfizi e Dolci</option>
                    </select>
                    <button onclick="addItem()" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg text-base hover:bg-indigo-700 active:scale-95 transition min-w-[48px] flex items-center justify-center">+</button>
                </div>
            </div>

            <!-- Lista Reparti -->
            <div id="listContainer" class="space-y-4"></div>

            <!-- Messaggio Nessun Risultato Trovato -->
            <div id="noResults" class="hidden text-center text-gray-500 py-8 text-sm">
                Nessun prodotto trovato.
            </div>

            <!-- Bottoni Azioni In Blocco -->
            <div class="flex justify-between items-center pt-4 border-t border-gray-200">
                <button onclick="deselezionaTutti()" class="text-xs text-gray-500 hover:text-indigo-600 underline">Deseleziona tutti</button>
                <button onclick="eliminaComprati()" class="text-xs text-red-500 hover:text-red-700 underline">Elimina elementi presi</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registrato'))
                    .catch(err => console.log('Errore Service Worker:', err));
            });
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBWi3L4DFxAPowky7N9bwgLck_gEcmnywY",
            authDomain: "lista-spesa-10e72.firebaseapp.com",
            databaseURL: "https://lista-spesa-10e72-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lista-spesa-10e72",
            storageBucket: "lista-spesa-10e72.firebasestorage.app",
            messagingSenderId: "628445802272",
            appId: "1:628445802272:web:74ae840b2a0b53c4ed7145"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let savedHouses = JSON.parse(localStorage.getItem('savedHouses')) || ['casa'];
        const urlParams = new URLSearchParams(window.location.search);
        let urlHouse = urlParams.get('house');

        if (urlHouse) {
            urlHouse = urlHouse.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
            if (urlHouse && !savedHouses.includes(urlHouse)) {
                savedHouses.push(urlHouse);
            }
        }

        let householdId = urlHouse || localStorage.getItem('householdId') || savedHouses[0] || 'casa';
        if (!savedHouses.includes(householdId)) {
            savedHouses.push(householdId);
        }

        localStorage.setItem('savedHouses', JSON.stringify(savedHouses));
        localStorage.setItem('householdId', householdId);

        let listRef = db.ref(`liste/${householdId}`);
        let currentItemsData = [];
        let hideChecked = false;

        // Gestione Auth Obbligatoria
        auth.onAuthStateChanged((user) => {
            const loginScreen = document.getElementById('loginScreen');
            const appContent = document.getElementById('appContent');
            
            if (user) {
                loginScreen.classList.add('hidden');
                appContent.classList.remove('hidden');
                document.getElementById('userName').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Utente';
                document.getElementById('userAvatar').src = user.photoURL || 'https://cdn-icons-png.flaticon.com/512/847/847969.png';
                
                renderHouseSelect();
                attachDatabaseListener();
            } else {
                loginScreen.classList.remove('hidden');
                appContent.classList.add('hidden');
            }
        });

        // Controlla il risultato di un eventuale reindirizzamento precedente
        auth.getRedirectResult().then((result) => {
            if (result && result.user) {
                console.log("Login riuscito via redirect");
            }
        }).catch((error) => {
            if (error && error.code) {
                alert("Errore Autenticazione: " + error.message + " (" + error.code + ")");
            }
        });

        async function loginGoogle() {
            try {
                // Primo tentativo: Pop-up
                await auth.signInWithPopup(provider);
            } catch (error) {
                console.warn("Tentativo Pop-up fallito o bloccato, provo Redirect...", error);
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    try {
                        // Secondo tentativo: Reindirizzamento
                        await auth.signInWithRedirect(provider);
                    } catch (redirErr) {
                        alert("Errore Login: " + redirErr.message + " [" + redirErr.code + "]");
                    }
                } else {
                    alert("Errore Login Google:\n" + error.message + "\n\nCodice: " + error.code);
                }
            }
        }

        function logoutGoogle() {
            auth.signOut();
        }

        function renderHouseSelect() {
            const select = document.getElementById('houseSelect');
            select.innerHTML = '';
            
            savedHouses.forEach(h => {
                const option = document.createElement('option');
                option.value = h;
                option.textContent = h === 'casa' ? 'Casa Mia' : h;
                if (h === householdId) option.selected = true;
                select.appendChild(option);
            });

            const addOption = document.createElement('option');
            addOption.value = '__ADD_NEW__';
            addOption.textContent = '➕ Nuova casa...';
            select.appendChild(addOption);
        }

        function onHouseSelectChange(value) {
            if (value === '__ADD_NEW__') {
                const nuovaCasa = prompt("Inserisci il nome identificativo della nuova casa (es. casa-suocera):");
                if (nuovaCasa && nuovaCasa.trim() !== "") {
                    const clean = nuovaCasa.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
                    if (clean) {
                        if (!savedHouses.includes(clean)) {
                            savedHouses.push(clean);
                            localStorage.setItem('savedHouses', JSON.stringify(savedHouses));
                        }
                        switchHouse(clean);
                        return;
                    }
                }
                renderHouseSelect();
            } else {
                switchHouse(value);
            }
        }

        function switchHouse(newHouseId) {
            householdId = newHouseId;
            localStorage.setItem('householdId', householdId);
            renderHouseSelect();
            listRef = db.ref(`liste/${householdId}`);
            attachDatabaseListener();
        }

        function eliminaCasaCorrente() {
            if (savedHouses.length <= 1) {
                alert("Devi mantenere almeno una casa salvata nell'elenco.");
                return;
            }
            if (confirm(`Rimuovere "${householdId}" dalle tue case salvate?`)) {
                savedHouses = savedHouses.filter(h => h !== householdId);
                localStorage.setItem('savedHouses', JSON.stringify(savedHouses));
                switchHouse(savedHouses[0]);
            }
        }

        const deptOrder = [
            "Ortofrutta", "Dispensa", "Carne e Pesce", "Latticini e Uova", 
            "Casa e Pulizia", "Bucato", "Igiene Personale", "Surgelati", "Sfizi e Dolci"
        ];

        const defaultItems = [
            { name: "Zucca", dept: "Ortofrutta", checked: false },
            { name: "Broccoli", dept: "Ortofrutta", checked: false },
            { name: "Cavolfiore", dept: "Ortofrutta", checked: false },
            { name: "Funghi (champignon o misti)", dept: "Ortofrutta", checked: false },
            { name: "Spinaci, bieta, zucchine o fagiolini", dept: "Ortofrutta", checked: false },
            { name: "Porri e cipolle (in abbondanza)", dept: "Ortofrutta", checked: false },
            { name: "Avocado", dept: "Ortofrutta", checked: false },
            { name: "Mele (renette o annurche), pere e melograno", dept: "Ortofrutta", checked: false },
            { name: "Pancetta a cubetti o speck a fiammiferi", dept: "Carne e Pesce", checked: false },
            { name: "Alette di pollo, petti di pollo o fesa di tacchino", dept: "Carne e Pesce", checked: false },
            { name: "Petto di pollo/tacchino", dept: "Carne e Pesce", checked: false },
            { name: "Fettine di manzo", dept: "Carne e Pesce", checked: false },
            { name: "Macinato di manzo", dept: "Carne e Pesce", checked: false },
            { name: "Tonno o sgombro in vetro/scatola", dept: "Carne e Pesce", checked: false },
            { name: "Salmone (tranci o filetti)", dept: "Carne e Pesce", checked: false },
            { name: "Orata o branzino", dept: "Carne e Pesce", checked: false },
            { name: "Uova (a pasta gialla/arancione)", dept: "Latticini e Uova", checked: false },
            { name: "Stracchino (confezionato/pastorizzato, es. Granarolo)", dept: "Latticini e Uova", checked: false },
            { name: "Yogurt Greco intero (5% di grassi)", dept: "Latticini e Uova", checked: false },
            { name: "Grana Padano o Parmigiano Reggiano", dept: "Latticini e Uova", checked: false },
            { name: "Latte intero", dept: "Latticini e Uova", checked: false },
            { name: "Fiocchi di latte", dept: "Latticini e Uova", checked: false },
            { name: "Pasta (trafilata al bronzo o integrale)", dept: "Dispensa", checked: false },
            { name: "Riso Basmati", dept: "Dispensa", checked: false },
            { name: "Mandorle, noci o nocciole", dept: "Dispensa", checked: false },
            { name: "Olio Extravergine d'Oliva", dept: "Dispensa", checked: false },
            { name: "Piselli fini surgelati", dept: "Surgelati", checked: false },
            { name: "Filetti di merluzzo / nasello surgelati", dept: "Surgelati", checked: false },
            { name: "Verdure per minestrone / macedonia di bosco", dept: "Surgelati", checked: false },
            { name: "Detersivo piatti", dept: "Casa e Pulizia", checked: false },
            { name: "Pastiglie / Gel Lavastoviglie", dept: "Casa e Pulizia", checked: false },
            { name: "Sgrassatore universale / Multiuso", dept: "Casa e Pulizia", checked: false },
            { name: "Carta casa / Rotoloni asciugatutto", dept: "Casa e Pulizia", checked: false },
            { name: "Sacchetti spazzatura (differenziata)", dept: "Casa e Pulizia", checked: false },
            { name: "Detersivo lavatrice (liquido o pod)", dept: "Bucato", checked: false },
            { name: "Ammorbidente / Profumatore bucato", dept: "Bucato", checked: false },
            { name: "Carta igienica", dept: "Igiene Personale", checked: false },
            { name: "Bagnoschiuma / Sapone liquido", dept: "Igiene Personale", checked: false },
            { name: "Dentifricio", dept: "Igiene Personale", checked: false },
            { name: "Biscotti avena/cornflakes con gocce di cioccolato", dept: "Sfizi e Dolci", checked: false },
            { name: "Cioccolato fondente (minimo 70-75%)", dept: "Sfizi e Dolci", checked: false }
        ];

        function attachDatabaseListener() {
            listRef.off();
            listRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    listRef.set(defaultItems);
                } else {
                    currentItemsData = data;
                    updateCounter();
                    filterList();
                }
            });
        }

        const deptIcons = {
            "Ortofrutta": "🥬", "Carne e Pesce": "🥩", "Latticini e Uova": "🧀",
            "Dispensa": "📦", "Surgelati": "❄️", "Casa e Pulizia": "🧹",
            "Bucato": "🧺", "Igiene Personale": "🧴", "Sfizi e Dolci": "🍫"
        };

        function updateCounter() {
            const total = currentItemsData.length;
            const checkedCount = currentItemsData.filter(i => i.checked).length;
            document.getElementById('progressCounter').textContent = `${checkedCount} di ${total} prodotti presi`;
        }

        function renderList(items) {
            const container = document.getElementById('listContainer');
            const noResults = document.getElementById('noResults');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            const grouped = {};
            items.forEach((item) => {
                if (!grouped[item.dept]) grouped[item.dept] = [];
                grouped[item.dept].push(item);
            });

            const sortedDepts = Object.keys(grouped).sort((a, b) => {
                let indexA = deptOrder.indexOf(a);
                let indexB = deptOrder.indexOf(b);
                if (indexA === -1) indexA = 99;
                if (indexB === -1) indexB = 99;
                return indexA - indexB;
            });

            for (const dept of sortedDepts) {
                const deptItems = grouped[dept];
                const deptCard = document.createElement('div');
                deptCard.className = 'bg-white rounded-xl p-4 shadow-sm border border-gray-100 overflow-hidden';

                const icon = deptIcons[dept] || '🛒';
                let itemsHtml = deptItems.map(item => `
                    <li class="flex items-center justify-between py-2.5 border-b border-gray-50 last:border-0 gap-2">
                        <label class="flex items-center gap-3 flex-1 cursor-pointer select-none min-w-0">
                            <input type="checkbox" 
                                   ${item.checked ? 'checked' : ''} 
                                   onchange="toggleCheck(${item.originalIndex})" 
                                   class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500 border-gray-300 flex-shrink-0">
                            <span class="text-sm ${item.checked ? 'item-checked' : 'text-gray-800'} break-words min-w-0">${item.name}</span>
                        </label>
                        <button onclick="deleteItem(${item.originalIndex})" class="text-gray-300 hover:text-red-500 text-xs p-1 flex-shrink-0">✕</button>
                    </li>
                `).join('');

                deptCard.innerHTML = `
                    <h2 class="font-bold text-sm text-indigo-900 border-b pb-2 mb-2 flex items-center gap-2">
                        <span>${icon}</span> Reparto ${dept}
                    </h2>
                    <ul>${itemsHtml}</ul>
                `;
                container.appendChild(deptCard);
            }
        }

        function filterList() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const clearBtn = document.getElementById('clearSearchBtn');

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            let indexedItems = currentItemsData.map((item, index) => ({ ...item, originalIndex: index }));
            
            if (hideChecked) {
                indexedItems = indexedItems.filter(item => !item.checked);
            }

            const filtered = indexedItems.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.dept.toLowerCase().includes(query)
            );

            renderList(filtered);
        }

        function toggleHideChecked() {
            hideChecked = !hideChecked;
            const btn = document.getElementById('hideCheckedBtn');
            const label = document.getElementById('hideCheckedLabel');

            if (hideChecked) {
                btn.classList.add('bg-indigo-50', 'border-indigo-300', 'text-indigo-700');
                label.textContent = "Mostra tutti";
            } else {
                btn.classList.remove('bg-indigo-50', 'border-indigo-300', 'text-indigo-700');
                label.textContent = "Solo da prendere";
            }
            filterList();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterList();
        }

        function toggleCheck(index) {
            listRef.child(index).child('checked').transaction(checked => !checked);
        }

        function addItem() {
            const nameInput = document.getElementById('newItemText');
            const deptInput = document.getElementById('newItemDept');
            const name = nameInput.value.trim();
            const dept = deptInput.value;

            if (name) {
                listRef.once('value', snapshot => {
                    const currentList = snapshot.val() || [];
                    currentList.push({ name, dept, checked: false });
                    listRef.set(currentList);
                    nameInput.value = '';
                });
            }
        }

        function deleteItem(index) {
            listRef.once('value', snapshot => {
                const currentList = snapshot.val() || [];
                currentList.splice(index, 1);
                listRef.set(currentList);
            });
        }

        function deselezionaTutti() {
            listRef.once('value', snapshot => {
                const currentList = snapshot.val() || [];
                const updatedList = currentList.map(item => ({ ...item, checked: false }));
                listRef.set(updatedList);
            });
        }

        function eliminaComprati() {
            if (confirm("Vuoi eliminare definitivamente tutti gli elementi già presi/spuntati?")) {
                listRef.once('value', snapshot => {
                    const currentList = snapshot.val() || [];
                    const updatedList = currentList.filter(item => !item.checked);
                    listRef.set(updatedList);
                });
            }
        }

        function copiaLink() {
            const inviteUrl = `${window.location.origin}${window.location.pathname}?house=${householdId}`;
            navigator.clipboard.writeText(inviteUrl).then(() => {
                alert(`Link d'invito copiato per "${householdId}"!\n\nInvia questo link via WhatsApp per far accedere subito chi vuoi a questa lista.`);
            }).catch(() => {
                prompt("Copia e invia questo link d'invito:", inviteUrl);
            });
        }
    </script>
</body>
</html>
